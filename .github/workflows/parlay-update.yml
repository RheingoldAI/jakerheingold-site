name: Update parlay dashboard

on:
  schedule:
    # 8:00 AM ET Tuesday (13:00 UTC — EST-based; runs ~9am ET during EDT months)
    - cron: '0 13 * * 2'
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r parlay/requirements.txt

      - name: Run parlay pipeline
        run: python parlay/parlay_model.py

      - name: Commit and push updated page
        run: |
          git config user.name "parlay-dashboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add parlay/index.html
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Auto-update parlay dashboard ($(date -u +%Y-%m-%d))"
            git push
          fi
